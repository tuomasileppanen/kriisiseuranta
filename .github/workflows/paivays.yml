name: Paivita Kriisitiedot Paivittain

on:
  schedule:
    - cron: '0 6 * * *' # Ajetaan joka päivä klo 06:00 UTC
  workflow_dispatch: # Mahdollistaa myös manuaalisen testauksen napista

jobs:
  paivita-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Vaaditaan, että robotti saa tallentaa uuden tietokannan repositorioon
    steps:
      - name: Hae koodisto repositoriosta
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Asenna vaaditut kirjastot
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aja kriisianalysaattori (Hakee uudet uutiset & markkinat)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 kriisi_analysaattori.py

      - name: Tallenna päivittynyt tietokanta takaisin GitHubiin
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add uutiset.db
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automaattinen tietokannan päivitys [skip ci]" && git push)
