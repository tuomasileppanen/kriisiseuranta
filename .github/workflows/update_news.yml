name: Päivitä Kriisiuutiset

on:
  schedule:
    - cron: '0 6 * * *' # Ajaa joka päivä klo 06:00 UTC
  workflow_dispatch:

jobs:
  run-analyzer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kloonaa repositorio
        uses: actions/checkout@v4

      - name: Asenna Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Asenna riippuvuudet
        run: |
          pip install --upgrade pip
          pip install feedparser pandas plotly streamlit google-generativeai

      - name: Aja kriisianalysaattori
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python kriisi_analysaattori.py

      - name: Tallenna tietokanta takaisin GitHubiin
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add uutiset.db
          git diff --staged --quiet || git commit -m "Automaattinen uutispäivitys [skip ci]"
          git push
